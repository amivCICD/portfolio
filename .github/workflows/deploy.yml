name: Build And Deploy Portfolio

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    env:
      IMAGE: artimusmaximus/portfolio
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Validate image configuration
        run: test -n "$IMAGE"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: printf '%s' "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      IMAGE: artimusmaximus/portfolio
      CONTAINER: portfolio
      PORT: "8083"
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE"
          test -n "$CONTAINER"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          (( PORT >= 1 && PORT <= 65535 ))

      - name: Pull image for this commit
        run: docker pull "$IMAGE:$GITHUB_SHA"

      - name: Replace portfolio container
        shell: bash
        run: |
          set -euo pipefail
          if docker container inspect "$CONTAINER" > /dev/null 2>&1; then
            docker stop "$CONTAINER"
            docker rm "$CONTAINER"
          fi
          docker run -d --restart unless-stopped \
            --name "$CONTAINER" \
            -p "127.0.0.1:$PORT:80" \
            "$IMAGE:$GITHUB_SHA"
